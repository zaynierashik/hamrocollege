{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users</title>
    <link href="{% static 'css/input.css' %}" rel="stylesheet">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <link href="{% static 'css/admin-studio.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body class="studio-body">
<main class="studio-main">
    <div id="main-wrapper" class="flex">
        {% include "components/admin_sidebar.html" %}

        <div class="w-full page-wrapper overflow-hidden xl:pl-[250px]">
            {% include "components/admin_header.html" %}

            <main class="h-full overflow-y-auto max-w-full pb-6">
                <div class="container full-container xl:px-5 px-4">
                    <section class="studio-content-wrap">
                        <div class="studio-panel-head mb-4">
                            <div>
                                <h1 class="studio-panel-title">Users</h1>
                                <p class="studio-subtitle">All registered platform users.</p>
                            </div>
                        </div>

                        <div class="studio-table-wrap relative overflow-x-auto">
                            <table class="studio-table">
                                <thead>
                                <tr>
                                    <th>S.N.</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Phone</th>
                                </tr>
                                </thead>
                                <tbody>
                                {% for user in users %}
                                    <tr>
                                        <td>{{ forloop.counter }}</td>
                                        <td>{{ user.name }}</td>
                                        <td>{{ user.email }}</td>
                                        <td>{{ user.phone }}</td>
                                    </tr>
                                {% endfor %}
                                </tbody>
                            </table>
                        </div>
                    </section>
                </div>
            </main>
        </div>
    </div>
</main>

<script src="{% static 'js/dashboard.js' %}"></script>
<script src="{% static 'js/sidebarmenu.js' %}"></script>
<script src="{% static 'libs/jquery/dist/jquery.min.js' %}"></script>
<script src="{% static 'libs/simplebar/dist/simplebar.min.js' %}"></script>
<script src="{% static 'libs/iconify-icon/dist/iconify-icon.min.js' %}"></script>
<script src="{% static 'libs/@preline/dropdown/index.js' %}"></script>
<script src="{% static 'libs/@preline/overlay/index.js' %}"></script>
</body>
</html>
