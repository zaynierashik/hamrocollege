{% load static %}

<aside id="application-sidebar-brand" class="studio-sidebar hs-overlay hs-overlay-open:translate-x-0 -translate-x-full transform hidden xl:block xl:translate-x-0 xl:end-auto xl:bottom-0 fixed top-0 h-screen z-[999] flex-shrink-0 left-sidebar transition-all duration-300">
    <div class="px-6 py-6">
        <a href="{% url 'dashboard' %}" class="studio-logo">
            <span class="inline-flex items-center justify-center w-8 h-8 rounded-lg bg-blue-600 text-white">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 6 12h4.5l-1.5 7.5L18 12h-4.5l1.5-7.5Z" />
                </svg>
            </span>
            <span>Hamrocollege</span>
        </a>
    </div>

    <div class="scroll-sidebar scrollbar-dark" data-simplebar="">
        <div class="px-4 pb-6">
            <p class="studio-nav-title">Main</p>
            <ul class="space-y-1.5">
                <li>
                    <a href="{% url 'dashboard' %}" class="studio-nav-link {% if request.path == '/dashboard/' %}is-active{% endif %}">
                        <i class="ti ti-layout-dashboard text-base"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                {% if admin and admin.role == "admin" %}
                <li>
                    <a href="{% url 'system-user' %}" class="studio-nav-link {% if request.path == '/system-user/' %}is-active{% endif %}">
                        <i class="ti ti-shield-check text-base"></i>
                        <span>System Users</span>
                    </a>
                </li>
                {% endif %}
                <li>
                    <a href="{% url 'user' %}" class="studio-nav-link {% if request.path == '/user/' %}is-active{% endif %}">
                        <i class="ti ti-users text-base"></i>
                        <span>Users</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'institution' %}" class="studio-nav-link {% if request.path == '/institution/' %}is-active{% endif %}">
                        <i class="ti ti-building-community text-base"></i>
                        <span>Institutions</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'course' %}" class="studio-nav-link {% if request.path == '/course/' or request.path|slice:':13' == '/edit-course/' %}is-active{% endif %}">
                        <i class="ti ti-book text-base"></i>
                        <span>Courses</span>
                    </a>
                </li>
                {% if admin and admin.role == "admin" %}
                <li>
                    <a href="{% url 'feedback' %}" class="studio-nav-link {% if request.path == '/feedback/' %}is-active{% endif %}">
                        <i class="ti ti-message-circle-2 text-base"></i>
                        <span>Feedback</span>
                    </a>
                </li>
                {% endif %}
            </ul>

            <p class="studio-nav-title">Account</p>
            <ul class="space-y-1.5">
                <li>
                    <a href="{% url 'admin-profile' %}" class="studio-nav-link {% if request.path == '/admin-profile/' %}is-active{% endif %}">
                        <i class="ti ti-user-circle text-base"></i>
                        <span>Profile</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'admin-logout' %}" class="studio-nav-link">
                        <i class="ti ti-logout text-base"></i>
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</aside>
