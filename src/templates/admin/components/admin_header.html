{% load static %}

<header class="container full-container w-full py-4 xl:px-5 px-4">
    <nav class="studio-topbar flex items-center justify-between gap-4" aria-label="Global">
        <div class="flex items-center gap-3">
        </div>

        <div class="flex items-center gap-3">
            <div class="hs-dropdown relative inline-flex [--placement:bottom-right]">
                <button class="hs-dropdown-toggle cursor-pointer align-middle rounded-md flex items-center gap-2" type="button">
                    <img class="studio-avatar" src="{% static 'images/profile/user-1.jpg' %}" alt="Admin">
                    <div class="hidden lg:block text-left">
                        <p class="text-sm font-semibold text-gray-700">{{ admin.name|default:'System Admin' }}</p>
                        <p class="text-xs text-gray-500">{{ admin.email|default:'admin@hamrocollege.com' }}</p>
                    </div>
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 mt-2 min-w-max w-[210px] hidden z-[12] studio-content-wrap p-2" aria-labelledby="hs-dropdown-custom-icon-trigger">
                    <a href="{% url 'admin-profile' %}" class="studio-nav-link text-slate-700 hover:bg-slate-100 rounded-md px-3 py-2 text-sm flex items-center gap-2">
                        <i class="bx bx-user text-lg"></i>
                        <span>My Profile</span>
                    </a>
                    <a href="{% url 'admin-logout' %}" class="studio-nav-link text-rose-600 hover:bg-rose-50 rounded-md px-3 py-2 text-sm flex items-center gap-2">
                        <i class="bx bx-log-out text-lg"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
