{% load static %}

<header class="container full-container w-full py-4 xl:px-5 px-4">
    <nav class="studio-topbar flex items-center justify-between gap-4" aria-label="Global">
        <div class="flex items-center gap-3 w-full max-w-[520px]">
            <button class="text-xl icon-hover cursor-pointer text-gray-600 xl:hidden" id="headerCollapse" data-hs-overlay="#application-sidebar-brand" aria-controls="application-sidebar-brand" aria-label="Toggle navigation" type="button">
                <i class="ti ti-menu-2"></i>
            </button>
            <div class="studio-search w-full">
                <i class="ti ti-search text-gray-400"></i>
                <input type="text" placeholder="Search...">
                <span class="text-xs text-gray-400 font-semibold">⌘K</span>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <span class="studio-tag hidden md:inline-flex">
                <i class="ti ti-sparkles text-blue-500"></i>
                Admin Assistant
            </span>

            <div class="hs-dropdown relative inline-flex [--placement:bottom-right]">
                <button class="hs-dropdown-toggle cursor-pointer align-middle rounded-md flex items-center gap-2" type="button">
                    <img class="studio-avatar" src="{% static 'images/profile/user-1.jpg' %}" alt="Admin">
                    <div class="hidden lg:block text-left">
                        <p class="text-sm font-semibold text-gray-700">{{ admin.name|default:'System Admin' }}</p>
                        <p class="text-xs text-gray-500">{{ admin.email|default:'admin@hamrocollege.com' }}</p>
                    </div>
                    <i class="ti ti-chevron-down text-gray-500"></i>
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 mt-2 min-w-max w-[210px] hidden z-[12] studio-content-wrap p-2" aria-labelledby="hs-dropdown-custom-icon-trigger">
                    <a href="{% url 'admin-profile' %}" class="studio-nav-link">
                        <i class="ti ti-user"></i>
                        <span>My Profile</span>
                    </a>
                    <a href="{% url 'admin-logout' %}" class="studio-nav-link text-red-600 hover:bg-red-50 hover:text-red-700">
                        <i class="ti ti-logout"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
