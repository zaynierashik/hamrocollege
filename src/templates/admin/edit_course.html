{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
    <link href="{% static 'css/input.css' %}" rel="stylesheet">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <link href="{% static 'css/admin-studio.css' %}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
</head>
<body class="studio-body">
<main class="studio-main">
    <div id="main-wrapper" class="flex">
        {% include "components/admin_sidebar.html" %}

        <div class="w-full page-wrapper overflow-hidden xl:pl-[250px]">
            {% include "components/admin_header.html" %}

            <main class="h-full overflow-y-auto max-w-full pb-6">
                <div class="container full-container xl:px-5 px-4">
                    <section class="studio-content-wrap">
                        <div class="studio-panel-head mb-5">
                            <div>
                                <h1 class="studio-panel-title">Edit Course</h1>
                                <p class="studio-subtitle">Update course metadata and publish details.</p>
                            </div>
                            <a href="{% url 'course' %}" class="studio-btn-ghost">
                                <i class="ti ti-arrow-left mr-1"></i> Back to Courses
                            </a>
                        </div>

                        <form action="{% url 'update-course' course.id %}" method="POST" class="space-y-4">
                            {% csrf_token %}
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="md:col-span-2">
                                    <label for="name" class="text-sm font-medium text-gray-700">Name <span class="text-red-600">*</span></label>
                                    <input type="text" value="{{ course.name }}" name="name" id="name" class="studio-input mt-1" required>
                                </div>
                                <div>
                                    <label for="abbreviation" class="text-sm font-medium text-gray-700">Abbreviation</label>
                                    <input type="text" value="{{ course.abbreviation }}" name="abbreviation" id="abbreviation" class="studio-input mt-1">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                                <div>
                                    <label for="field" class="text-sm font-medium text-gray-700">Field <span class="text-red-600">*</span></label>
                                    <select id="field" name="field" class="studio-select mt-1" required>
                                        <option value="" {% if not course.field %}selected{% endif %}>Choose field</option>
                                        {% for field in fields %}
                                            <option value="{{ field.0 }}" {% if course.field == field.0 %}selected{% endif %}>{{ field.1 }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div>
                                    <label for="year" class="text-sm font-medium text-gray-700">Duration (Years) <span class="text-red-600">*</span></label>
                                    <input type="text" value="{{ course.year }}" name="year" id="year" class="studio-input mt-1" required>
                                </div>
                                <div>
                                    <label for="level" class="text-sm font-medium text-gray-700">Level <span class="text-red-600">*</span></label>
                                    <select id="level" name="level" class="studio-select mt-1" required>
                                        <option value="" {% if not course.level %}selected{% endif %}>Choose level</option>
                                        {% for level in levels %}
                                            <option value="{{ level.0 }}" {% if course.level == level.0 %}selected{% endif %}>{{ level.1 }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div>
                                    <label for="affiliation" class="text-sm font-medium text-gray-700">Affiliation <span class="text-red-600">*</span></label>
                                    <select id="affiliation" name="affiliation" class="studio-select mt-1" onchange="toggleForeignUniversityField()" required>
                                        <option value="" {% if not course.affiliation %}selected{% endif %}>Choose affiliation</option>
                                        {% for affiliation in affiliation_choices %}
                                            <option value="{{ affiliation.0 }}" {% if course.affiliation == affiliation.0 %}selected{% endif %}>{{ affiliation.1 }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                            </div>

                            <div id="foreign-university-field" class="hidden">
                                <label for="foreign_university_name" class="text-sm font-medium text-gray-700">Foreign University Name</label>
                                <input type="text" value="{{ course.Foreign_University_Name }}" name="foreign_university_name" id="foreign_university_name" class="studio-input mt-1">
                            </div>

                            <div>
                                <label for="about" class="text-sm font-medium text-gray-700">About <span class="text-red-600">*</span></label>
                                <textarea name="about" id="about" rows="4" class="studio-textarea mt-1" required>{{ course.about }}</textarea>
                            </div>

                            <div>
                                <label for="eligibility" class="text-sm font-medium text-gray-700">Eligibility</label>
                                <textarea name="eligibility" id="eligibility" rows="3" class="studio-textarea mt-1">{{ course.eligibility }}</textarea>
                            </div>

                            <div>
                                <label for="admission_criteria" class="text-sm font-medium text-gray-700">Admission Criteria</label>
                                <textarea name="admission_criteria" id="admission_criteria" rows="3" class="studio-textarea mt-1">{{ course.Admission_Criteria }}</textarea>
                            </div>

                            <div>
                                <label for="job_prospect" class="text-sm font-medium text-gray-700">Job Prospect</label>
                                <textarea name="job_prospect" id="job_prospect" rows="3" class="studio-textarea mt-1">{{ course.Job_Prospect }}</textarea>
                            </div>

                            <div>
                                <label for="prospect_career" class="text-sm font-medium text-gray-700">Prospect Career</label>
                                <textarea name="prospect_career" id="prospect_career" rows="3" class="studio-textarea mt-1">{{ course.Prospect_Career }}</textarea>
                            </div>

                            <div>
                                <label for="offered_by" class="text-sm font-medium text-gray-700">Offered By</label>
                                <select id="offered_by" name="offered_by" class="studio-select mt-1" multiple>
                                    <option disabled>Select institutions</option>
                                    {% for institution in institutions %}
                                        <option value="{{ institution.id }}" {% if institution in course.Offered_by.all %}selected{% endif %}>{{ institution.name }}</option>
                                    {% endfor %}
                                </select>
                                <p class="text-xs text-gray-500 mt-2">Use Ctrl/Command to select multiple institutions.</p>
                            </div>

                            <button type="submit" class="studio-btn-primary w-full">Save Changes</button>
                        </form>
                    </section>
                </div>
            </main>
        </div>
    </div>
</main>

<script>
    function toggleForeignUniversityField() {
        const affiliationSelect = document.getElementById('affiliation');
        const foreignUniversityField = document.getElementById('foreign-university-field');
        if (!affiliationSelect || !foreignUniversityField) {
            return;
        }
        foreignUniversityField.classList.toggle('hidden', affiliationSelect.value !== 'foreign');
    }

    toggleForeignUniversityField();
</script>
<script src="{% static 'js/dashboard.js' %}"></script>
<script src="{% static 'js/sidebarmenu.js' %}"></script>
<script src="{% static 'libs/jquery/dist/jquery.min.js' %}"></script>
<script src="{% static 'libs/simplebar/dist/simplebar.min.js' %}"></script>
<script src="{% static 'libs/iconify-icon/dist/iconify-icon.min.js' %}"></script>
<script src="{% static 'libs/@preline/dropdown/index.js' %}"></script>
<script src="{% static 'libs/@preline/overlay/index.js' %}"></script>
</body>
</html>
