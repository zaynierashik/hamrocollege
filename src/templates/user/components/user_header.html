{% load static %}

<header class="container full-container w-full text-sm py-5 xl:px-5 px-5">
    <nav class=" w-full flex items-center justify-between" aria-label="Global">
        <ul class="icon-nav flex items-center gap-4">
        </ul>

        <div class="flex items-center gap-x-4">
            <div class="hs-dropdown relative inline-flex [--placement:bottom-right]">
                <button class="relative hs-dropdown-toggle cursor-pointer align-middle rounded-lg p-0.5 hover:ring-2 hover:ring-slate-200 transition-all">
                    <img class="object-cover w-9 h-9 rounded-lg" src="{% static 'images/profile/user-1.jpg' %}" alt="Profile">
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 mt-2 min-w-max w-[200px] hidden z-[12] bg-white border border-slate-200 rounded-lg shadow-lg p-2" aria-labelledby="hs-dropdown-custom-icon-trigger">
                    <a href="{% url 'profile' %}" class="flex gap-2.5 items-center px-3 py-2 text-slate-700 rounded-md hover:bg-slate-100 transition-colors">
                        <i class="bx bx-user text-lg text-slate-500"></i>
                        <span class="text-sm font-medium">My Profile</span>
                    </a>
                    <div class="my-1 border-t border-slate-100"></div>
                    <a href="{% url 'logout' %}" class="flex gap-2.5 items-center px-3 py-2 text-rose-600 rounded-md hover:bg-rose-50 transition-colors">
                        <i class="bx bx-log-out text-lg"></i>
                        <span class="text-sm font-medium">Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
