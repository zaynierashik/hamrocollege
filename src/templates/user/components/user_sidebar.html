{% load static %}

<aside id="application-sidebar-brand"
    class="bg-white border-r border-slate-200 hs-overlay hs-overlay-open:translate-x-0 -translate-x-full transform hidden xl:block xl:translate-x-0 xl:end-auto xl:bottom-0 fixed top-0 with-vertical h-screen z-[999] flex-shrink-0 w-[270px] left-sidebar transition-all duration-300">
    <div class="px-6 py-6 border-b border-slate-100">
        <a href="{% url 'userpage' %}">
            <img src="{% static 'images/logos/logo.png' %}" class="h-10 w-auto block" alt="Hamrocollege Logo" />
        </a>
    </div>

    <!-- Sidebar -->
    <div class="scroll-sidebar" data-simplebar="">
        <div class="px-4 py-6">
            <nav class="w-full flex flex-col sidebar-nav">
                <ul id="sidebarnav" class="text-slate-700 text-sm space-y-1">
                    <li class="text-xs font-semibold tracking-wider text-slate-400 px-3 pb-2 uppercase">
                        <span>Main</span>
                    </li>

                    <li class="sidebar-item">
                        <a class="sidebar-link gap-3 py-2.5 px-3 rounded-lg w-full flex items-center font-medium hover:bg-slate-100 hover:text-slate-900 transition-colors"
                            href="{% url 'userpage' %}">
                            <i class="bx bx-grid-alt text-xl text-slate-500"></i>
                            <span>Dashboard</span>
                        </a>
                    </li>

                    <li class="text-xs font-semibold tracking-wider text-slate-400 px-3 pt-6 pb-2 uppercase">
                        <span>Sections</span>
                    </li>

                    <li class="sidebar-item">
                        <a href="{% url 'institutions' %}"
                            class="sidebar-link gap-3 py-2.5 px-3 rounded-lg w-full flex items-center font-medium hover:bg-slate-100 hover:text-slate-900 transition-colors">
                            <i class="bx bx-building text-xl text-slate-500"></i>
                            <span>Institutions</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="{% url 'courses' %}"
                            class="sidebar-link gap-3 py-2.5 px-3 rounded-lg w-full flex items-center font-medium hover:bg-slate-100 hover:text-slate-900 transition-colors">
                            <i class="bx bx-book-open text-xl text-slate-500"></i>
                            <span>Courses</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="{% url 'applications' %}"
                            class="sidebar-link gap-3 py-2.5 px-3 rounded-lg w-full flex items-center font-medium hover:bg-slate-100 hover:text-slate-900 transition-colors">
                            <i class="bx bx-file text-xl text-slate-500"></i>
                            <span>Applications</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="{% url 'chat' %}"
                            class="sidebar-link gap-3 py-2.5 px-3 rounded-lg w-full flex items-center font-medium hover:bg-slate-100 hover:text-slate-900 transition-colors">
                            <i class="bx bx-bot text-xl text-slate-500"></i>
                            <span>ChatBot</span>
                        </a>
                    </li>

                    <li class="sidebar-item">
                        <a href="{% url 'feedbacks' %}"
                            class="sidebar-link gap-3 py-2.5 px-3 rounded-lg w-full flex items-center font-medium hover:bg-slate-100 hover:text-slate-900 transition-colors">
                            <i class="bx bx-comment-detail text-xl text-slate-500"></i>
                            <span>Feedbacks</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </div>
</aside>
