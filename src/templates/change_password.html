{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png'%}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="{% static 'css/input.css' %}" rel="stylesheet">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
    <style>
        /* Underline input focus effect */
        .auth-input-wrap {
            border-bottom: 1px solid rgba(15, 31, 41, 0.22);
            transition: border-color 0.25s ease;
        }

        .auth-input-wrap:focus-within {
            border-bottom-color: #5c0017;
        }
    </style>
</head>

<body>
    <div class="flex items-center min-h-screen p-6 bg-gray-50 dark:bg-gray-900">
        <div class="flex-1 h-full max-w-4xl mx-auto overflow-hidden bg-white rounded-xs">
            <div class="flex flex-col overflow-y-auto md:flex-row">
                <div class="h-32 md:h-auto md:w-1/2">
                    <img src="{% static 'images/profile/change-password.png' %}" alt="Change Password">
                </div>
        
                <div class="flex items-center justify-center p-6 sm:p-12 md:w-1/2">
                    <div class="w-full">
                        <form id="changePasswordForm" action="{% url 'change-user-password' %}" method="POST">
                            {% csrf_token %}
                            <div class="relative auth-input-wrap mb-6">
                                <label for="email" class="block mb-1.5 text-[0.82rem] font-semibold tracking-[0.03em] uppercase text-[#27404d]">
                                    Email Address
                                </label>
                                <input type="email" name="email" id="email" class="w-full border-none bg-transparent text-[#0f1f29] text-sm outline-none p-3 placeholder-[#83969e]" placeholder="john@example.com" required>
                            </div>

                            <div class="relative auth-input-wrap mb-6">
                                <label for="otp" class="block mb-1.5 text-[0.82rem] font-semibold tracking-[0.03em] uppercase text-[#27404d]">
                                    OTP
                                </label>
                                <input type="text" name="otp" id="otp" class="w-full border-none bg-transparent text-[#0f1f29] text-sm outline-none p-3 placeholder-[#83969e]" placeholder="012345" required>
                            </div>

                            <div class="relative auth-input-wrap mb-6">
                                <label for="new_password" class="block mb-1.5 text-[0.82rem] font-semibold tracking-[0.03em] uppercase text-[#27404d]">
                                    New Password
                                </label>
                                <input type="password" name="new_password" id="new_password" class="w-full border-none bg-transparent text-[#0f1f29] text-sm outline-none p-3 placeholder-[#83969e]" placeholder="New Password" required>
                            </div>

                            <button type="submit" class="w-full text-center uppercase text-[#f7fffb] font-semibold text-[0.95rem] py-3 px-4 bg-[#ba964c] cursor-pointer">
                                Change Password
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toast-container" class="fixed top-5 right-5 z-50">
        {% if message %}
        <div id="toast" class="flex items-center w-full max-w-xs p-4 mb-4 text-gray-500 bg-white rounded-lg shadow dark:bg-gray-800 dark:text-gray-400" role="alert">
            <div class="text-sm font-normal">
                {{ message }}
            </div>
        </div>
        {% endif %}
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
