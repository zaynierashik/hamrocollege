{% load static %}

<header class="container full-container w-full py-4 xl:px-5 px-4">
    <nav class="studio-topbar flex items-center justify-between gap-4" aria-label="Global">
        <div class="flex items-center gap-3">
        </div>

        <div class="flex items-center gap-3">
            <div class="hs-dropdown relative inline-flex [--placement:bottom-right]">
                <button class="hs-dropdown-toggle cursor-pointer align-middle rounded-md flex items-center gap-2" type="button">
                    <img class="studio-avatar" src="{% static 'images/profile/user-1.jpg' %}" alt="Institution Admin">
                    <div class="hidden lg:block text-left">
                        <p class="text-sm font-semibold text-gray-700">{{ institution.admin|default:'Institution Admin' }}</p>
                        <p class="text-xs text-gray-500">{{ institution.email|default:'admin@institution.com' }}</p>
                    </div>
                </button>

                <div class="hs-dropdown-menu transition-[opacity,margin] duration hs-dropdown-open:opacity-100 opacity-0 mt-2 min-w-max w-[210px] hidden z-[12] studio-content-wrap p-2" aria-labelledby="hs-dropdown-custom-icon-trigger">
                    <a href="{% url 'institution-admin-profile' %}" class="studio-nav-link">
                        <i class="ti ti-user"></i>
                        <span>My Profile</span>
                    </a>
                    <a href="{% url 'institution-logout' %}" class="studio-nav-link text-red-600 hover:bg-red-50 hover:text-red-700">
                        <i class="ti ti-logout"></i>
                        <span>Logout</span>
                    </a>
                </div>
            </div>
        </div>
    </nav>
</header>
