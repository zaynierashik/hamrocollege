{% load static %}

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gurkha Cyber Force</title>
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'favicon/apple-touch-icon.png'%}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon/favicon-16x16.png' %}">
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fustat:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="{% static 'css/input.css' %}" rel="stylesheet">
    <link href="{% static 'css/output.css' %}" rel="stylesheet">
	<link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <link href="{% static 'css/admin-studio.css' %}" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
	<main class="studio-main">
		<div id="main-wrapper" class="flex">
			<!-- Sidebar -->
			{% include "components/institution_sidebar.html" %}

			<div class="w-full page-wrapper overflow-hidden xl:pl-[250px]">
				<!-- Header -->
				{% include "components/institution_header.html" %}

				<!-- Main Content -->
				<main class="h-full overflow-y-auto max-w-full pb-6" id="institution-edit-card">
					<div class="container full-container xl:px-6 px-4">
						<div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm relative">
                            <div class="flex items-center justify-between pb-4 border-b border-slate-100 mb-5">
                                <h4 class="text-lg font-bold text-slate-900">Edit: {{ offered_course.course }}</h4>
                                <a href="{% url 'programs' %}" class="text-slate-400 hover:text-slate-600 transition-colors">
                                    <i class="bx bx-x text-2xl"></i>
                                </a>
                            </div>

                                <div class="relative overflow-x-auto">
                                    <form action="{% url 'update-offered-course' offered_course.id %}" method="POST" enctype="multipart/form-data">
                                        {% csrf_token %}
                                        <div>
                                            <div class="mb-6">
                                                <label for="course" class="block mb-2 text-sm font-medium text-gray-700">Course</label>
                                                <input type="text" value="{{ offered_course.course }}" name="course" id="course" class="border border-gray-400 text-sm rounded-md block w-full p-2.5 py-[10px] bg-transparent text-gray-700 focus:border-gray-700 focus:ring-0 outline-none transition-all duration-700" readonly>
                                            </div>

                                            <div class="mb-6">
                                                <label for="details" class="block mb-2 text-sm/6 font-medium text-gray-900">Details <span class="text-red-600">*</span></label>
                                                <textarea name="details" id="details" rows="14" class="block w-full rounded-md bg-white px-3 py-1.5 text-sm text-gray-900 border-gray-400 focus:border-gray-700 focus:ring-0 outline-none transition-all duration-700" required>{{ offered_course.details }}</textarea>
                                            </div>
                                        </div>
        
                                        <div class="mb-4">
                                            <button type="submit" class="tracking-wide py-2.5 px-4 bg-gray-500 text-white w-full transition ease-in duration-200 text-center text-sm font-medium shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 rounded-lg" type="submit">
                                                Save Changes
                                            </button>
                                        </div>
                                    </form>
                                </div>									
                            </div>
                        </div>
					</div>
				</main>
			</div>
		</div>
	</main>
	
    <script src="{% static 'js/script.js' %} "></script>
	<script src="{% static 'js/sidebarmenu.js' %} "></script>
    <script src="{% static 'js/dashboard.js' %} "></script>
	<script src="{% static 'libs/simplebar/dist/simplebar.min.js' %} "></script>
	<script src="{% static 'libs/iconify-icon/dist/iconify-icon.min.js' %} "></script>
	<script src="{% static 'libs/@preline/dropdown/index.js' %} "></script>
	<script src="{% static 'libs/@preline/overlay/index.js' %} "></script>
</body>
</html>
